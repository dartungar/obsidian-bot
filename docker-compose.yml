services:
  obsidian-sync:
    build:
      context: .
      dockerfile: Dockerfile
      target: sync
    environment:
      - OBSIDIAN_COMPONENT_ROLE=sync
      - OBSIDIAN_SYNC_ENABLED=${OBSIDIAN_SYNC_ENABLED:-false}
      - OBSIDIAN_VAULT_PATH=/var/notes
      - OBSIDIAN_SYNC_STATE_DIRECTORY=/var/lib/obsidian-bot/sync
      - OBSIDIAN_SYNC_CONFIG_DIRECTORY=/var/lib/obsidian-headless
      - XDG_CONFIG_HOME=/var/lib/obsidian-headless
      - OBSIDIAN_SYNC_VAULT=${OBSIDIAN_SYNC_VAULT:-}
      - OBSIDIAN_AUTH_TOKEN=${OBSIDIAN_AUTH_TOKEN:-}
      - OBSIDIAN_AUTH_TOKEN_FILE=${OBSIDIAN_AUTH_TOKEN_FILE:-}
      - OBSIDIAN_ACCOUNT_EMAIL=${OBSIDIAN_ACCOUNT_EMAIL:-}
      - OBSIDIAN_ACCOUNT_PASSWORD=${OBSIDIAN_ACCOUNT_PASSWORD:-}
      - OBSIDIAN_ACCOUNT_PASSWORD_FILE=${OBSIDIAN_ACCOUNT_PASSWORD_FILE:-}
      - OBSIDIAN_ACCOUNT_MFA_CODE=${OBSIDIAN_ACCOUNT_MFA_CODE:-}
      - OBSIDIAN_ACCOUNT_MFA_CODE_FILE=${OBSIDIAN_ACCOUNT_MFA_CODE_FILE:-}
      - OBSIDIAN_SYNC_PASSWORD=${OBSIDIAN_SYNC_PASSWORD:-}
      - OBSIDIAN_SYNC_PASSWORD_FILE=${OBSIDIAN_SYNC_PASSWORD_FILE:-}
      - OBSIDIAN_SYNC_CREATE_REMOTE=${OBSIDIAN_SYNC_CREATE_REMOTE:-false}
      - OBSIDIAN_SYNC_ADOPT_EXISTING=${OBSIDIAN_SYNC_ADOPT_EXISTING:-false}
      - OBSIDIAN_SYNC_DEVICE_NAME=${OBSIDIAN_SYNC_DEVICE_NAME:-obsidian-bot}
      - OBSIDIAN_AGENT_WRITABLE_FOLDERS=${OBSIDIAN_AGENT_WRITABLE_FOLDERS:-_inbox}
      - OBSIDIAN_AGENT_DENIED_FOLDERS=${OBSIDIAN_AGENT_DENIED_FOLDERS:-.obsidian,.git,attachments,templates,04 archive}
      - OBSIDIAN_SYNC_REGION=${OBSIDIAN_SYNC_REGION:-}
      - OBSIDIAN_SYNC_INTERVAL_SECONDS=${OBSIDIAN_SYNC_INTERVAL_SECONDS:-25}
      - OBSIDIAN_SYNC_TIMEOUT_SECONDS=${OBSIDIAN_SYNC_TIMEOUT_SECONDS:-180}
      - OBSIDIAN_SYNC_INITIAL_TIMEOUT_SECONDS=${OBSIDIAN_SYNC_INITIAL_TIMEOUT_SECONDS:-1800}
      - OBSIDIAN_SYNC_STALE_AFTER_SECONDS=${OBSIDIAN_SYNC_STALE_AFTER_SECONDS:-300}
      - OBSIDIAN_SYNC_MAX_BACKOFF_SECONDS=${OBSIDIAN_SYNC_MAX_BACKOFF_SECONDS:-300}
      - OBSIDIAN_SYNC_ATTENTION_RETRY_SECONDS=${OBSIDIAN_SYNC_ATTENTION_RETRY_SECONDS:-900}
      - ASPNETCORE_URLS=http://+:8080
    volumes:
      - /var/obsidian:/var/notes
      - obsidian-bot-data:/var/lib/obsidian-bot
      - obsidian-headless-data:/var/lib/obsidian-headless
    restart: unless-stopped
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "dotnet", "ObsidianBot.dll", "--health-check", "http://127.0.0.1:8080/sync-healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30m

  obsidian-bot:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - OBSIDIAN_COMPONENT_ROLE=telegram
      - OBSIDIAN_SYNC_ENABLED=${OBSIDIAN_SYNC_ENABLED:-false}
      - OBSIDIAN_SYNC_STATE_DIRECTORY=/var/lib/obsidian-bot/sync
      - OBSIDIAN_SYNC_STALE_AFTER_SECONDS=${OBSIDIAN_SYNC_STALE_AFTER_SECONDS:-300}
      - TELEGRAM_BOT_TOKEN=${OBSIDIAN_BOT_TOKEN}
      - TELEGRAM_ALLOWED_USER_ID=${TELEGRAM_ALLOWED_USER_ID}
      - BUTLER_TIMEZONE=${BUTLER_TIMEZONE:-UTC}
      - OBSIDIAN_VAULT_PATH=/var/notes
      - OBSIDIAN_DAILY_NOTES_PATTERN=${OBSIDIAN_DAILY_NOTES_PATTERN:-04 archive/journal/daily journal/*.md}
      - OBSIDIAN_INBOX_NOTE_PATH=${OBSIDIAN_INBOX_NOTE_PATH:-_inbox/_inbox.md}
      - OBSIDIAN_MEDIA_FOLDER_PATH=${OBSIDIAN_MEDIA_FOLDER_PATH:-_inbox}
      - OBSIDIAN_SEARCH_DATABASE_PATH=/var/lib/obsidian-bot/telegram-search.db
      - OBSIDIAN_SEARCH_RESULT_LIMIT=${OBSIDIAN_SEARCH_RESULT_LIMIT:-5}
      - OBSIDIAN_SEARCH_RECONCILE_INTERVAL_SECONDS=${OBSIDIAN_SEARCH_RECONCILE_INTERVAL_SECONDS:-60}
      - ASPNETCORE_URLS=http://+:8080
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_EMBEDDINGS_URL=${OPENAI_EMBEDDINGS_URL:-https://api.openai.com/v1/embeddings}
      - OPENAI_EMBEDDING_MODEL=${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      - OPENAI_EMBEDDING_DIMENSIONS=${OPENAI_EMBEDDING_DIMENSIONS:-1536}
    volumes:
      - /var/obsidian:/var/notes
      - obsidian-bot-data:/var/lib/obsidian-bot
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "dotnet", "ObsidianBot.dll", "--health-check", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - homepage.group=Bots
      - homepage.name=Obsidian Bot
      - homepage.icon=sh-pandoc-light.png
      - homepage.href=https://coolify.dartungar.com/project/ycsgggs0kssowcwgskww4cg8/environment/kk4sgs8wsgk44gc80c8soggk/application/r7bsa9osr3p7pwucxhe9oi7w

  obsidian-agent-api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - OBSIDIAN_COMPONENT_ROLE=agent-api
      - OBSIDIAN_SYNC_ENABLED=${OBSIDIAN_SYNC_ENABLED:-false}
      - OBSIDIAN_SYNC_STATE_DIRECTORY=/var/lib/obsidian-bot/sync
      - OBSIDIAN_SYNC_STALE_AFTER_SECONDS=${OBSIDIAN_SYNC_STALE_AFTER_SECONDS:-300}
      - OBSIDIAN_VAULT_PATH=/var/notes
      - OBSIDIAN_SEARCH_DATABASE_PATH=/var/lib/obsidian-bot/agent-search.db
      - OBSIDIAN_PROPOSAL_DATABASE_PATH=/var/lib/obsidian-bot/proposals.db
      - OBSIDIAN_PROPOSAL_SNAPSHOT_DIRECTORY=/var/lib/obsidian-bot/snapshots
      - OBSIDIAN_AGENT_API_TOKEN=${OBSIDIAN_AGENT_API_TOKEN:-}
      - OBSIDIAN_REVIEW_API_TOKEN=${OBSIDIAN_REVIEW_API_TOKEN:-}
      - OBSIDIAN_AGENT_READABLE_FOLDERS=${OBSIDIAN_AGENT_READABLE_FOLDERS:-}
      - OBSIDIAN_AGENT_WRITABLE_FOLDERS=${OBSIDIAN_AGENT_WRITABLE_FOLDERS:-_inbox}
      - OBSIDIAN_AGENT_DENIED_FOLDERS=${OBSIDIAN_AGENT_DENIED_FOLDERS:-.obsidian,.git,attachments,templates,04 archive}
      - OBSIDIAN_AGENT_DIRECT_ALLOWED_HEADINGS=${OBSIDIAN_AGENT_DIRECT_ALLOWED_HEADINGS:-Notes,Decisions,Tasks,Next Steps,Journal,Agent Capture}
      - OBSIDIAN_DIRECT_CHANGE_MAX_CONTENT_BYTES=${OBSIDIAN_DIRECT_CHANGE_MAX_CONTENT_BYTES:-25600}
      - OBSIDIAN_DIRECT_CHANGE_UNDO_WINDOW_SECONDS=${OBSIDIAN_DIRECT_CHANGE_UNDO_WINDOW_SECONDS:-86400}
      - OBSIDIAN_PROPOSAL_TTL_HOURS=${OBSIDIAN_PROPOSAL_TTL_HOURS:-24}
      - OBSIDIAN_PROPOSAL_MAX_MARKDOWN_LENGTH=${OBSIDIAN_PROPOSAL_MAX_MARKDOWN_LENGTH:-20000}
      - ASPNETCORE_URLS=http://+:8080
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_EMBEDDINGS_URL=${OPENAI_EMBEDDINGS_URL:-https://api.openai.com/v1/embeddings}
      - OPENAI_EMBEDDING_MODEL=${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      - OPENAI_EMBEDDING_DIMENSIONS=${OPENAI_EMBEDDING_DIMENSIONS:-1536}
    volumes:
      - /var/obsidian:/var/notes
      - obsidian-bot-data:/var/lib/obsidian-bot
    ports:
      - "${OBSIDIAN_API_BIND_ADDRESS:-127.0.0.1}:${OBSIDIAN_API_PORT:-6772}:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "dotnet", "ObsidianBot.dll", "--health-check", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  obsidian-publisher:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - OBSIDIAN_COMPONENT_ROLE=publisher
      - OBSIDIAN_SYNC_ENABLED=${OBSIDIAN_SYNC_ENABLED:-false}
      - OBSIDIAN_SYNC_STATE_DIRECTORY=/var/lib/obsidian-bot/sync
      - OBSIDIAN_SYNC_STALE_AFTER_SECONDS=${OBSIDIAN_SYNC_STALE_AFTER_SECONDS:-300}
      - OBSIDIAN_VAULT_PATH=/var/notes
      - OBSIDIAN_PROPOSAL_DATABASE_PATH=/var/lib/obsidian-bot/proposals.db
      - OBSIDIAN_PROPOSAL_SNAPSHOT_DIRECTORY=/var/lib/obsidian-bot/snapshots
      - OBSIDIAN_AGENT_WRITABLE_FOLDERS=${OBSIDIAN_AGENT_WRITABLE_FOLDERS:-_inbox}
      - OBSIDIAN_AGENT_DENIED_FOLDERS=${OBSIDIAN_AGENT_DENIED_FOLDERS:-.obsidian,.git,attachments,templates,04 archive}
      - OBSIDIAN_PUBLISHER_POLL_INTERVAL_SECONDS=${OBSIDIAN_PUBLISHER_POLL_INTERVAL_SECONDS:-2}
      - ASPNETCORE_URLS=http://+:8080
    volumes:
      - /var/obsidian:/var/notes
      - obsidian-bot-data:/var/lib/obsidian-bot
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "dotnet", "ObsidianBot.dll", "--health-check", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  obsidian-bot-data:
  obsidian-headless-data:
